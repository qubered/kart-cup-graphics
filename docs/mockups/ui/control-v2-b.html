<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Control page v2 — Option B · Look bank</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="control-v2/common.css">
  <style>
    /* Option B — "Look bank". The surface is a bank of look buttons (ATEM macros / vMix / Stream Deck pages).
       Tap = load into Preview. STORE then tap a slot = save. A sequence strip along the bottom is the cue list. */
    .mainb { position: absolute; left: 14px; right: 14px; top: 58px; bottom: 108px; display: grid; grid-template-columns: 690px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) 160px; gap: 12px 14px; }
    .lcol { display: flex; flex-direction: column; gap: 12px; min-height: 0; min-width: 0; }
    .tweak { padding: 10px 12px; display: grid; gap: 8px; }
    .tweak .tr { display: grid; grid-template-columns: 74px 1fr; gap: 8px; align-items: center; }
    .tweak .tr > .lab { font-size: 10.5px; }
    .tweak .seg button { height: 40px; font-size: 12px; padding: 0 6px; }
    .tweak .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .tweak .tgl { min-height: 40px; padding: 0 10px; } .tweak .tgl .sw { width: 34px; height: 20px; } .tweak .tgl .sw::after { width: 14px; height: 14px; } .tweak .tgl.on .sw::after { left: 17px; }
    .bank { min-width: 0; }
    .bh { display: flex; align-items: center; gap: 6px; padding: 0 10px; height: 60px; border-bottom: 1px solid var(--ui-line); flex: none; }
    .pgtab { height: 44px; padding: 0 16px; border-radius: 8px; color: var(--ui-muted); font-weight: 600; border: 1px solid transparent; display: flex; align-items: center; gap: 8px; }
    .pgtab.on { background: #1d2430; color: #fff; border-color: #3a4455; } .pgtab .ct { font-size: 11px; background: #232834; border-radius: 8px; padding: 1px 7px; color: #cbd5e1; }
    .store { margin-left: auto; height: 46px; padding: 0 20px; border-radius: 8px; border: 2px solid #b45309; color: #fbbf24; font: 800 15px var(--ui-font); letter-spacing: .1em; display: flex; align-items: center; gap: 10px; }
    .store.on { background: #f59e0b; color: #1f1300; border-color: #fbbf24; }
    .storebar { background: #3a2a07; color: #fde68a; font-size: 12.5px; font-weight: 600; padding: 8px 14px; border-bottom: 1px solid #5c4410; flex: none; }
    .slots { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; padding: 12px; align-content: start; flex: 1; min-height: 0; overflow: hidden; }
    .slot { border: 1px solid var(--ui-line); border-radius: 10px; background: var(--ui-panel-2); padding: 5px; display: block; position: relative; text-align: left; }
    .slot .th { aspect-ratio: 16/9; border-radius: 5px; overflow: hidden; position: relative; background: #000; }
    .slot .nm { display: block; padding: 6px 3px 3px; font-weight: 600; font-size: 12.5px; color: #e5e7eb; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .slot .no { position: absolute; left: 9px; top: 9px; z-index: 4; font: 700 11px var(--ui-mono); color: #fff; background: rgba(0,0,0,.65); border-radius: 4px; padding: 2px 5px; }
    .slot .tag { position: absolute; right: 9px; top: 9px; z-index: 4; }
    .slot.pvw { border-color: var(--ui-preview); box-shadow: 0 0 0 2px var(--ui-preview); background: #0f2418; }
    .slot.pgm { border-color: var(--ui-program); box-shadow: 0 0 0 2px var(--ui-program); background: #2a1010; }
    .slot.empty { border-style: dashed; background: transparent; } .slot.empty .th { background: repeating-linear-gradient(45deg, #151922 0 8px, #12151b 8px 16px); display: grid; place-content: center; color: #4b5563; font-size: 12px; }
    .slot.empty .nm { color: #4b5563; font-weight: 500; }
    .slot.armed.empty { border-color: #b45309; background: #1c1405; } .slot.armed.empty .th { background: #12151b; } .slot.armed.empty .nm { color: #fbbf24; }
    .slot.armed.filled { border-color: #b45309; }
    .slot.confirm { border-color: #fbbf24; box-shadow: 0 0 0 2px #fbbf24; background: #3a2a07; }
    .slot .ov { position: absolute; inset: 0; z-index: 6; display: grid; place-content: center; text-align: center; background: rgba(60,40,5,.86); color: #fde68a; font-weight: 800; font-size: 12.5px; line-height: 1.25; }
    .slot .ov small { font-weight: 500; font-size: 10.5px; display: block; }
    .slot .ghostp { position: absolute; inset: 0; opacity: .5; }
    .seqp { grid-column: 1 / -1; min-width: 0; }
    .sqh { display: flex; align-items: center; gap: 8px; padding: 0 10px; height: 44px; border-bottom: 1px solid var(--ui-line); flex: none; }
    .sqb { display: flex; gap: 8px; padding: 10px; align-items: stretch; flex: 1; min-height: 0; }
    .chips { display: flex; gap: 8px; flex: 1; min-width: 0; overflow: hidden; }
    .chip { flex: none; width: 134px; border: 1px solid var(--ui-line); border-radius: 8px; background: var(--ui-panel-2); padding: 4px; position: relative; text-align: left; display: flex; flex-direction: column; }
    .chip .th { aspect-ratio: 16/9; border-radius: 4px; overflow: hidden; position: relative; background: #000; }
    .chip .nm { padding: 4px 3px 0; font-size: 12px; font-weight: 600; color: #e5e7eb; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chip .no { position: absolute; left: 8px; top: 8px; z-index: 4; font: 700 10.5px var(--ui-mono); color: #fff; background: rgba(0,0,0,.65); border-radius: 3px; padding: 2px 5px; }
    .chip .pill { position: absolute; right: 8px; bottom: 28px; z-index: 4; }
    .chip.pgm { border-color: var(--ui-program); box-shadow: 0 0 0 2px var(--ui-program); background: #2a1010; } .chip.pvw { border-color: var(--ui-preview); box-shadow: 0 0 0 2px var(--ui-preview); background: #0f2418; } .chip.done { opacity: .5; }
    .chip .tg2 { position: absolute; right: 8px; top: 8px; z-index: 4; }
    .chip .then { position: absolute; left: 8px; bottom: 28px; z-index: 4; background: rgba(0,0,0,.7); border-radius: 3px; padding: 1px 4px; font-size: 10px; }
    .addchip { flex: none; width: 90px; border: 1px dashed #3a4455; border-radius: 8px; display: grid; place-content: center; text-align: center; color: var(--ui-muted); font-size: 12px; }
    .gob { flex: none; width: 230px; display: grid; grid-template-rows: 1fr 40px; gap: 8px; }
    .gob .go { height: auto; } .gob .go .gl { font-size: 38px; }
    .gob .nav2 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
    .gob .nav2 button { height: 40px; padding: 0; font-size: 12px; }
    .rec { height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid #7f1d1d; color: #fca5a5; font-weight: 700; font-size: 12px; display: flex; align-items: center; gap: 7px; }
  </style>
</head>
<body>
<div class="ui" id="ui"></div>
<script src="control-v2/common.js"></script>
<script>
  Object.assign(LOOKS, {
    winb: { name: 'Race win — board', scene: 'raceWin', bg: 'B', part: 'full', used: 0 }, standF: { name: 'Final standings', scene: 'standings', bg: 'A', used: 0 },
    lts: { name: 'Lower thirds only', scene: 'none', bg: 'none', lt: true, used: 0 }, qr: { name: 'Stream QR', scene: 'qr', bg: 'A', used: 0 },
    nextT: { name: 'Next race — twins', scene: 'nextRace', bg: 'B', used: 0 }, bracket: { name: 'Bracket', scene: 'bracket', bg: 'B', used: 0 },
  })
  const PAGES = [['Pre-show', ['hold', 'title', 'lineup', 'notice']], ['Races', ['next', 'win', 'winb', 'stand', 'nextT', 'lts', 'bracket', 'standF', 'cup', 'qr']], ['Results', ['standF', 'cup', 'bracket']], ['Sponsors', ['notice', 'qr']]]
  const S = { view: 'live', page: 1, store: false, confirm: null, pvwLook: 'win', pgmLook: 'next', pvw: 4, pgm: 3, scene: 'raceWin', bg: 'B', track: true, lt: false, part: 'hero', mod: true, out: 'wide', toast: '' }
  const SLOTS = 20
  const takeLbl = (t) => (t === 'cut' ? 'CUT' : t === 'auto' ? 'AUTO' : 'RECALL')
  const cs = (i) => (i === S.pgm ? 'pgm' : i === S.pvw ? 'pvw' : i < S.pgm ? 'done' : '')

  function monitors() {
    const cur = OUTS.find((o) => o.id === S.out), pg = LOOKS[S.pgmLook]
    const tabs = OUTS.map((o) => `<button class="otab ${o.id === S.out ? 'on' : ''}" data-act="out" data-o="${o.id}"><i class="led ${o.on ? 'on' : ''}"></i>${o.name}${o.pend ? `<span class="p">${o.pend}</span>` : ''}</button>`).join('')
    return `<div class="otabs">${tabs}<span class="sp"></span><button class="otab">Multiview ↗</button></div>
      <div class="mon pv"><div class="t">PREVIEW · ${cur.name.toUpperCase()}</div><div class="src">${S.mod ? '<span class="tag mod">MODIFIED</span>' : ''}${LOOKS[S.pvwLook].name}</div>${gfx(S.scene, S.scene === 'none' ? 'none' : S.bg, { track: S.track, lt: S.lt, part: S.part })}</div>
      <div class="mon pg"><div class="t">PROGRAM · ${cur.name.toUpperCase()}</div><div class="src">${pg.name}</div>${gfx(pg.scene, pg.bg, { track: true, part: pg.part })}</div>`
  }
  function tweak() {
    const sc = ['title', 'lineup', 'nextRace', 'standings', 'raceWin', 'cupWin'], nm = { title: 'Title', lineup: 'Line-up', nextRace: 'Next race', standings: 'Standings', raceWin: 'Race win', cupWin: 'Cup win' }
    return `<section class="panel tweak"><div class="tr"><span class="lab">Scene</span><div class="seg">${sc.map((s) => `<button class="${S.scene === s ? 'sel' : ''}" data-act="scene" data-s="${s}">${nm[s]}</button>`).join('')}<button>More ▾</button></div></div>
      <div class="tr"><span class="lab">Background</span><div class="two" style="grid-template-columns:1.8fr 1fr 1fr"><div class="seg">${['A', 'B', 'C', '—'].map((b) => `<button class="${(S.bg === b || (b === '—' && S.bg === 'none')) ? 'sel' : ''} ${b === 'B' ? 'livedot' : ''}" data-act="bg" data-b="${b === '—' ? 'none' : b}">${b}</button>`).join('')}</div>
        <button class="tgl ${S.track ? 'on' : ''} livedot" data-act="track">Track<span class="sw"></span></button><button class="tgl ${S.lt ? 'on' : ''}" data-act="lt">Lower 3rds<span class="sw"></span></button></div></div>
      <div class="tr"><span class="lab">Win part</span><div class="two" style="grid-template-columns:1.4fr 1fr 1fr"><div class="seg">${['full', 'hero', 'board'].map((p) => `<button class="${S.part === p ? 'sel' : ''}" data-act="part" data-p="${p}">${p[0].toUpperCase() + p.slice(1)}</button>`).join('')}</div><div class="field" style="height:40px">Active match<span class="car">▾</span></div><button class="btn" style="height:40px">Split outputs</button></div></div></section>`
  }
  function bank() {
    const [pname, ids] = PAGES[S.page]
    const tabs = PAGES.map(([n, l], i) => `<button class="pgtab ${i === S.page ? 'on' : ''}" data-act="page" data-i="${i}">${n}<span class="ct">${l.length}</span></button>`).join('')
    let cells = ''
    for (let i = 0; i < SLOTS; i++) {
      const id = ids[i], no = i + 1
      if (!id) { cells += S.store
        ? `<button class="slot empty armed" data-act="storeto" data-i="${i}"><span class="no">${no}</span><div class="th"><div class="ghostp">${gfx(S.scene, S.bg, { track: S.track })}</div></div><span class="nm">＋ Store Preview here</span></button>`
        : `<div class="slot empty"><span class="no">${no}</span><div class="th">empty</div><span class="nm">—</span></div>`; continue }
      const L = LOOKS[id], st = id === S.pgmLook ? 'pgm' : id === S.pvwLook ? 'pvw' : ''
      const conf = S.confirm === i
      cells += `<button class="slot filled ${st} ${S.store ? 'armed' : ''} ${conf ? 'confirm' : ''}" data-act="${S.store ? 'storeto' : 'load'}" data-i="${i}" data-l="${id}"><span class="no">${no}</span>${st === 'pgm' ? '<span class="tag pgm">ON AIR</span>' : st === 'pvw' ? '<span class="tag pvw">PVW</span>' : ''}<div class="th">${gfx(L.scene, L.bg, { part: L.part, lt: L.lt })}${conf ? `<div class="ov"><span>Tap again to overwrite<small>“${L.name}” · used in ${L.used} cues</small></span></div>` : ''}</div><span class="nm">${L.name}</span></button>`
    }
    return `<section class="panel bank"><div class="bh">${tabs}<button class="pgtab" style="padding:0 12px">＋</button><button class="store ${S.store ? 'on' : ''}" data-act="store">${S.store ? '● STORING' : 'STORE'}</button></div>
      ${S.store ? '<div class="storebar">STORE — tap an empty slot to save Preview there · tap a filled slot twice to overwrite it · Esc to cancel</div>' : ''}
      <div class="slots">${cells}</div></section>`
  }
  function seq() {
    const chips = CUES.map((c, i) => { const L = LOOKS[c.look], st = cs(i)
      return `<button class="chip ${st}" data-act="chip" data-i="${i}"><span class="no">${i + 1}</span>${st === 'pgm' ? '<span class="tag pgm tg2">ON AIR</span>' : st === 'pvw' ? '<span class="tag pvw tg2">NEXT</span>' : ''}<div class="th">${gfx(L.scene, L.bg, { part: L.part })}<span class="pill ${c.take}">${takeLbl(c.take)}</span>${c.after ? '<span class="then tag" style="color:#fbbf24;background:rgba(0,0,0,.7)">↳ next race</span>' : ''}</div><span class="nm">${L.name}</span></button>` }).join('')
    return `<section class="panel seqp"><div class="sqh"><span class="lab">Sequence</span><button class="btn sm" style="height:34px;padding:0 10px">Main show <span class="dim">▾</span></button><span class="dim" style="font-size:12px">${S.pvw + 1} / ${CUES.length} · tap a chip to set Next · drag to reorder</span>
        <button class="btn sm" style="margin-left:auto;height:34px;border-color:var(--ui-accent);color:#bfdbfe" data-act="addprev">＋ Add Preview as cue</button><button class="rec" data-act="rec"><i class="led" style="background:#ef4444"></i>REC — tap looks to append</button></div>
      <div class="sqb"><div class="chips">${chips}</div>
        <div class="gob"><button class="go" data-act="go"><span class="gl">GO</span><span class="gt"><small>cue ${S.pvw + 1} · ${takeLbl(CUES[S.pvw].take)}</small><b>${LOOKS[CUES[S.pvw].look].name}</b></span></button>
          <div class="nav2"><button class="btn" data-act="prev">◀ Back</button><button class="btn" data-act="skip">Skip ▶</button><button class="btn">Rewind</button></div></div></div></section>`
  }
  function render() {
    document.getElementById('ui').innerHTML = `${topBar([['Live', 'live'], ['Show data', 'data'], ['Setup', 'setup']], 'live')}
      <div class="mainb"><div class="lcol">${monitors()}${tweak()}</div>${bank()}${seq()}</div>${transport()}${S.toast ? `<div class="toast">${S.toast}</div>` : ''}`
    fit()
  }
  const loadLook = (id) => { const L = LOOKS[id]; S.pvwLook = id; S.scene = L.scene; S.bg = L.bg; S.part = L.part || 'hero'; S.lt = !!L.lt; S.mod = false }
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-act]'); if (!t) return
    const a = t.dataset.act, d = t.dataset
    if (a === 'page') { S.page = +d.i; S.confirm = null }
    else if (a === 'store') { S.store = !S.store; S.confirm = null }
    else if (a === 'storeto') { const ids = PAGES[S.page][1]; if (!ids[+d.i]) { S.store = false; S.toast = `Stored Preview in slot ${+d.i + 1} &nbsp; <b style="text-decoration:underline">Undo</b>` } else if (S.confirm === +d.i) { S.confirm = null; S.store = false; S.mod = false; S.toast = 'Overwrote “' + LOOKS[d.l].name + '” &nbsp; <b style="text-decoration:underline">Undo</b>' } else S.confirm = +d.i }
    else if (a === 'load') loadLook(d.l)
    else if (a === 'chip') { S.pvw = +d.i; loadLook(CUES[S.pvw].look) }
    else if (a === 'go') { S.pgm = S.pvw; S.pgmLook = CUES[S.pgm].look; S.pvw = Math.min(S.pvw + 1, CUES.length - 1); loadLook(CUES[S.pvw].look) }
    else if (a === 'prev') S.pvw = Math.max(0, S.pvw - 1)
    else if (a === 'skip') S.pvw = Math.min(CUES.length - 1, S.pvw + 1)
    else if (a === 'scene') { S.scene = d.s; S.mod = true } else if (a === 'bg') { S.bg = d.b; S.mod = true } else if (a === 'part') { S.part = d.p; S.mod = true }
    else if (a === 'track') { S.track = !S.track; S.mod = true } else if (a === 'lt') { S.lt = !S.lt; S.mod = true } else if (a === 'out') S.out = d.o
    render()
  })
  addEventListener('keydown', (e) => { if (e.key === 'Escape') { S.store = false; S.confirm = null; render() } })
  const st = new URLSearchParams(location.search).get('state')
  if (st === 'store') { S.store = true; S.confirm = 3 }
  render()
</script>
</body>
</html>
