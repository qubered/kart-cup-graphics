<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Next / Previous Cue</title>
  <script src="sdpi-components.js"></script>
</head>
<body>
  <sdpi-item label="Direction">
    <sdpi-select setting="direction" default="next">
      <option value="next">Next cue</option>
      <option value="prev">Previous cue</option>
    </sdpi-select>
  </sdpi-item>
  <sdpi-item label="Take">
    <sdpi-select setting="take" default="none">
      <option value="none">Recall only (don't take)</option>
      <option value="cut">Cut</option>
      <option value="auto">Auto</option>
    </sdpi-select>
  </sdpi-item>
  <sdpi-item label="Server">
    <sdpi-textfield setting="serverUrl" global placeholder="http://localhost:8080"></sdpi-textfield>
  </sdpi-item>
</body>
</html>
